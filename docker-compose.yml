# -----------------------------------------------------------------------------
# Services
#   postgres         PostgreSQL 16: pipeline tables + Airflow's own metadata DB
#   airflow-db-init  one-off: creates the Airflow role/database if missing
#   airflow          Apache Airflow 3.3.2 (standalone: scheduler + API/UI + DAG processor)
#   pipeline         the Python pipeline as a one-off container (profile "cli")
#
# Usage (from the repository root, after `cp .env.example .env`):
#   docker compose up -d --build             # postgres + airflow (UI: http://localhost:8080)
#   docker compose run --rm pipeline         # or run the whole pipeline without Airflow
#   docker compose run --rm pipeline python -m src.cli status
#   docker compose down                      # stop (add -v to also delete the database volume)
# -----------------------------------------------------------------------------
name: dss150p-fire-risk

x-pipeline-environment: &pipeline-environment
  POSTGRES_HOST: postgres                     # service name on the compose network
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-firerisk}
  POSTGRES_USER: ${POSTGRES_USER:-firerisk}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example to .env first)}
  PIPELINE_LOG_LEVEL: ${PIPELINE_LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-firerisk}
      POSTGRES_USER: ${POSTGRES_USER:-firerisk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example to .env first)}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # nothing that needs the database starts before it accepts connections
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  airflow-db-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-firerisk}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-firerisk}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}
    volumes:
      - ./docker/postgres/create-airflow-db.sh:/create-airflow-db.sh:ro
    entrypoint: ["sh", "/create-airflow-db.sh"]
    restart: "no"

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: dss150p-fire-risk-airflow:1.0
    depends_on:
      postgres:
        condition: service_healthy
      airflow-db-init:
        condition: service_completed_successfully
    environment:
      <<: *pipeline-environment
      PIPELINE_TRIGGER: airflow
      PIPELINE_PROJECT_ROOT: /opt/project
      PYTHONPATH: /opt/project
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"   # schedule=None, so it only runs when triggered
      # Local lab only: every visitor of the UI is an admin, no login screen.
      # Remove this (and set real users) before exposing Airflow anywhere else.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    # Same user id as the pipeline container so both can rewrite the files.
    user: "${AIRFLOW_UID:-50000}:0"
    # `docker compose exec airflow ...` starts in the project folder, e.g.
    #   docker compose exec airflow python -m pytest tests/test_dag.py
    working_dir: /opt/project
    ports:
      - "${AIRFLOW_HOST_PORT:-8080}:8080"
    volumes:
      - ./:/opt/project
      - ./logs/airflow:/opt/airflow/logs     # task logs end up in logs/airflow/ (git-ignored)
    command: ["standalone"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: dss150p-fire-risk-pipeline:1.0
    profiles: ["cli"]          # not started by `docker compose up`; use `docker compose run`
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *pipeline-environment
      PIPELINE_TRIGGER: docker-compose
    user: "${AIRFLOW_UID:-50000}:0"
    volumes:
      - ./:/app
    command: ["python", "-m", "src.cli", "run-all"]

volumes:
  pgdata:
