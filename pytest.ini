[pytest]
# run from the repository root:  pytest            (or: docker compose run --rm pipeline pytest)
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    integration: crosses more than one module or a file/database boundary
    db: needs a reachable PostgreSQL server (skipped otherwise)
filterwarnings =
    ignore::DeprecationWarning
